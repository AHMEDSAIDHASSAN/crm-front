<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sira-theme');
          if (v === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            // Force light regardless of the OS dark mode — the app controls its own theme.
            document.documentElement.style.colorScheme = 'only light';
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'only light';
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <link rel="icon" type="image/png" href="/sira-logo.png" />
    <link rel="apple-touch-icon" href="/sira-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <title>SIRA CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
